name: Validate infrastructure
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    uses: ai-platform-portfolio/ops-shared/.github/workflows/validate.yml@f61b3e4f5c5db462c73581c0b95ddefef14b9569
    with:
      terraform-directories: '["modules/*/*"]'
      tofu-version: '1.13.9'

  module-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        module: [foundry, container-app]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
        with:
          tofu_version: '1.13.9'
          tofu_wrapper: false

      - run: tofu -chdir=modules/azure/${{ matrix.module }} init -backend=false -input=false

      - run: tofu -chdir=modules/azure/${{ matrix.module }} test
